<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Circle with Cyber Border -->
  <circle cx="64" cy="64" r="60" fill="url(#avatarBg)" stroke="#00E5FF" stroke-width="2.5" filter="url(#cyanGlow)"/>
  <!-- Geometric V-Prism -->
  <path d="M 32 38 L 64 96 L 96 38 L 82 38 L 64 70 L 46 38 Z" fill="url(#vGrad)"/>
  <path d="M 46 38 L 64 70 L 64 38 Z" fill="#00E5FF" opacity="0.85"/>
  <!-- Central Cryptographic Core -->
  <circle cx="64" cy="50" r="6" fill="#FFFFFF" filter="url(#cyanGlow)"/>
  <circle cx="64" cy="50" r="3" fill="#00E5FF"/>
</svg>